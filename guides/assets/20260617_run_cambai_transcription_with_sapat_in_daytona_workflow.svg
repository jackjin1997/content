<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Daytona Sapat CAMB.AI transcription workflow</title>
  <desc id="desc">A workflow diagram showing media files moving through a Daytona sandbox, Sapat conversion, CAMB.AI transcription, and transcript review.</desc>
  <rect width="1280" height="640" fill="#f7f9fc"/>
  <rect x="70" y="70" width="1140" height="500" rx="18" fill="#ffffff" stroke="#d7dde8" stroke-width="3"/>
  <text x="100" y="125" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#172033">Repeatable AI transcription in a Daytona sandbox</text>
  <text x="100" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#526071">Keep Python, ffmpeg, provider credentials, and generated transcripts in one isolated workflow.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="105" y="240" width="190" height="150" rx="12" fill="#eef6ff" stroke="#7bb4e8" stroke-width="2"/>
    <text x="200" y="292" font-size="22" font-weight="700" fill="#143b63" text-anchor="middle">Media file</text>
    <text x="200" y="328" font-size="17" fill="#315b7c" text-anchor="middle">MP4, MP3, WAV</text>
    <text x="200" y="356" font-size="17" fill="#315b7c" text-anchor="middle">or MOV input</text>

    <rect x="375" y="220" width="230" height="190" rx="12" fill="#ecfbf3" stroke="#69b98d" stroke-width="2"/>
    <text x="490" y="270" font-size="22" font-weight="700" fill="#195638" text-anchor="middle">Daytona sandbox</text>
    <text x="490" y="306" font-size="17" fill="#2f6b4b" text-anchor="middle">Python virtualenv</text>
    <text x="490" y="334" font-size="17" fill="#2f6b4b" text-anchor="middle">ffmpeg</text>
    <text x="490" y="362" font-size="17" fill="#2f6b4b" text-anchor="middle">CAMB_API_KEY</text>

    <rect x="685" y="240" width="190" height="150" rx="12" fill="#fff5e8" stroke="#e2a64d" stroke-width="2"/>
    <text x="780" y="292" font-size="22" font-weight="700" fill="#6a420d" text-anchor="middle">Sapat CLI</text>
    <text x="780" y="328" font-size="17" fill="#7b5520" text-anchor="middle">Convert audio</text>
    <text x="780" y="356" font-size="17" fill="#7b5520" text-anchor="middle">Select provider</text>

    <rect x="955" y="220" width="220" height="190" rx="12" fill="#f0edff" stroke="#9279df" stroke-width="2"/>
    <text x="1065" y="270" font-size="22" font-weight="700" fill="#3d2c73" text-anchor="middle">CAMB.AI</text>
    <text x="1065" y="306" font-size="17" fill="#56458a" text-anchor="middle">Create task</text>
    <text x="1065" y="334" font-size="17" fill="#56458a" text-anchor="middle">Poll status</text>
    <text x="1065" y="362" font-size="17" fill="#56458a" text-anchor="middle">Fetch transcript</text>

    <path d="M305 315 H365" stroke="#667085" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M615 315 H675" stroke="#667085" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M885 315 H945" stroke="#667085" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <rect x="405" y="470" width="470" height="58" rx="10" fill="#172033"/>
    <text x="640" y="507" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Output: customer-interview.txt for review, search, and follow-up</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#667085"/>
    </marker>
  </defs>
</svg>
